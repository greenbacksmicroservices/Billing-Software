{% extends 'base_auth.html' %}

{% block title %}Admin Panel Login - SaaS Portal{% endblock %}
{% block heading %}SaaS Admin Portal{% endblock %}
{% block subheading %}Enter system superuser credentials{% endblock %}

{% block content %}
<form method="POST">
    {% csrf_token %}
    <div class="form-group">
        <label for="username" class="form-label">Username</label>
        <input type="text" name="username" id="username" class="form-control" placeholder="Admin username" required autofocus>
    </div>
    
    <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <input type="password" name="password" id="password" class="form-control" placeholder="••••••••" required>
    </div>

    <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem; padding: 0.75rem;">
        <i class="fa-solid fa-lock-open"></i> Log In to System
    </button>
</form>

<div style="margin-top: 1.5rem; text-align: center; font-size: 0.85rem;">
    <a href="{% url 'company_login' %}" style="color: var(--primary); font-weight: 500;">
        <i class="fa-solid fa-arrow-right-long"></i> Switch to Company Login
    </a>
</div>
{% endblock %}
