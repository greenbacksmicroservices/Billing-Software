{% extends 'base_auth.html' %}

{% block title %}Forgot Password - GBL Billing{% endblock %}
{% block heading %}Forgot Password{% endblock %}
{% block subheading %}Enter your registered Email / User ID{% endblock %}

{% block content %}
<form method="POST">
    {% csrf_token %}
    <div class="form-group" style="margin-bottom: 1.5rem;">
        <label class="form-label">Email Address / Username</label>
        <input type="text" name="username" class="form-control" placeholder="Enter username or email" required autofocus style="width: 100%; box-sizing: border-box; padding: 0.75rem; border-radius: 4px; border: 1px solid var(--border);">
    </div>
    
    <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.75rem; font-weight: 600;">
        <i class="fa-solid fa-paper-plane" style="margin-right: 6px;"></i> Send OTP
    </button>
    
    <div style="margin-top: 1.5rem; text-align: center; font-size: 0.85rem;">
        <a href="{% url 'login' %}" style="color: var(--primary); text-decoration: none; font-weight: 600;">
            <i class="fa-solid fa-arrow-left-long" style="margin-right: 4px;"></i> Back to Login
        </a>
    </div>
</form>
{% endblock %}
