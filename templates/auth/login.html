{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - GBL Billing</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="{% static 'image/favicon.png' %}">
    <link rel="shortcut icon" href="{% static 'image/favicon.ico' %}">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #030712;
            color: #f3f4f6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Full screen video background */
        .login-video-wrapper {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: -3;
        }

        .login-background-video {
            position: absolute;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            transform: translate(-50%, -50%) scale(1.08);
            object-fit: cover;
            filter: blur(12px) brightness(0.8);
        }

        /* Dark overlay above video */
        .login-video-overlay {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at center, rgba(10, 20, 35, 0.45) 0%, rgba(3, 7, 18, 0.85) 100%),
                        linear-gradient(to bottom, rgba(10, 15, 30, 0.6) 0%, rgba(3, 7, 18, 0.9) 100%);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: -2;
        }

        /* Login Card */
        .login-card {
            background: rgba(10, 20, 35, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 18px;
            width: 100%;
            max-width: 390px;
            padding: 2rem 1.75rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.08);
            z-index: 10;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        /* Card header style */
        .login-header {
            text-align: center;
            margin-bottom: 1.65rem;
        }

        .login-title {
            font-size: 1.75rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -0.025em;
            margin-bottom: 0.5rem;
        }

        /* Accent line */
        .accent-line {
            width: 50px;
            height: 3px;
            background: linear-gradient(90deg, #ff7187, #e91e4d);
            border-radius: 2px;
            margin: 0 auto;
        }

        /* Form styling */
        .login-form-group {
            margin-bottom: 1.15rem;
            position: relative;
        }

        .login-input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .login-input-icon {
            position: absolute;
            left: 1rem;
            color: rgba(255, 255, 255, 0.4);
            font-size: 1rem;
            pointer-events: none;
            transition: color 0.2s ease;
        }

        .login-input {
            width: 100%;
            height: 46px;
            padding: 0 1rem 0 2.75rem;
            background: rgba(15, 23, 42, 0.45);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 10px;
            color: #ffffff;
            font-size: 0.9rem;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
        }

        .login-input::placeholder {
            color: rgba(255, 255, 255, 0.35);
        }

        .login-input:focus {
            border-color: #ff7187;
            background: rgba(15, 23, 42, 0.65);
            box-shadow: 0 0 0 3px rgba(255, 113, 135, 0.2);
        }

        .login-input:focus + .login-input-icon {
            color: #ff7187;
        }

        /* Password input specific toggles */
        .password-controls {
            position: absolute;
            right: 1rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            z-index: 10;
        }

        .toggle-password {
            color: rgba(255, 255, 255, 0.4);
            cursor: pointer;
            font-size: 0.95rem;
            transition: color 0.2s ease;
        }

        .toggle-password:hover {
            color: #ff7187;
        }

        /* Controls row (Remember + Forgot) */
        .login-controls-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.4rem;
            font-size: 0.84rem;
        }

        .login-checkbox-label {
            display: flex;
            align-items: center;
            gap: 0.45rem;
            cursor: pointer;
            color: rgba(255, 255, 255, 0.7);
            user-select: none;
        }

        .login-checkbox {
            appearance: none;
            width: 16px;
            height: 16px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 4px;
            background: rgba(15, 23, 42, 0.45);
            cursor: pointer;
            display: grid;
            place-content: center;
            outline: none;
            transition: background 0.2s ease, border-color 0.2s ease;
        }

        .login-checkbox:checked {
            background: #e91e4d;
            border-color: #ff7187;
        }

        .login-checkbox:checked::before {
            content: "\f00c";
            font-family: "Font Awesome 6 Free";
            font-weight: 900;
            color: white;
            font-size: 0.65rem;
        }

        .login-forgot-link {
            color: #ff7187;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s ease, text-decoration 0.2s ease;
        }

        .login-forgot-link:hover {
            color: #e91e4d;
            text-decoration: underline;
        }

        /* Error Messages inside the card */
        .login-error-container {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 8px;
            padding: 0.75rem 0.9rem;
            margin-bottom: 1.25rem;
            display: flex;
            align-items: center;
            gap: 0.65rem;
            color: #fca5a5;
            font-size: 0.84rem;
        }

        .login-error-container i {
            font-size: 1rem;
            flex-shrink: 0;
        }

        /* Submit Button */
        .login-submit-btn {
            width: 100%;
            height: 46px;
            background: linear-gradient(90deg, #ff7187, #e91e4d);
            border: none;
            border-radius: 10px;
            color: #ffffff;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            transition: opacity 0.2s ease, transform 0.1s ease, box-shadow 0.2s ease;
            box-shadow: 0 4px 14px rgba(233, 30, 77, 0.35);
        }

        .login-submit-btn:hover {
            opacity: 0.95;
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(233, 30, 77, 0.5);
        }

        .login-submit-btn:active {
            transform: translateY(1px);
        }

        .login-submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* Register text */
        .register-section {
            text-align: center;
            margin-top: 1.35rem;
            font-size: 0.84rem;
            color: rgba(255, 255, 255, 0.6);
        }

        .register-link {
            color: #ff7187;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s ease, text-decoration 0.2s ease;
            margin-left: 0.25rem;
        }

        .register-link:hover {
            color: #e91e4d;
            text-decoration: underline;
        }

        /* Footer styling */
        .login-footer {
            position: absolute;
            bottom: 1.5rem;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.4);
            text-align: center;
            width: 90%;
            z-index: 10;
            pointer-events: none;
        }

        /* Responsive design Adjustments */
        @media (max-width: 576px) {
            .login-card {
                width: calc(100% - 32px);
                max-width: 100%;
                padding: 1.75rem 1.25rem;
                margin: 1rem auto;
            }
            .login-title {
                font-size: 1.5rem;
            }
            .login-controls-row {
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
                gap: 0.5rem;
            }
            body {
                justify-content: center;
                padding-top: 0;
            }
        }
    </style>
</head>
<body>

    <!-- Full screen video background -->
    <div class="login-video-wrapper">
        <video class="login-background-video" autoplay muted loop playsinline>
            <source src="{% static 'Video/Login_Video.mp4' %}" type="video/mp4">
        </video>
        <div class="login-video-overlay"></div>
    </div>

    <!-- Centered Glassmorphic Card -->
    <div class="login-card">
        <div class="login-header">
            <h2 class="login-title">Login</h2>
            <div class="accent-line"></div>
        </div>

        <!-- Django Authentication Messages -->
        {% if messages %}
            {% for message in messages %}
                <div class="login-error-container">
                    <i class="fa-solid fa-triangle-exclamation"></i>
                    <span>{{ message }}</span>
                </div>
            {% endfor %}
        {% endif %}

        <!-- Form submission -->
        <form method="POST" id="loginForm">
            {% csrf_token %}
            
            <!-- Email Field -->
            <div class="login-form-group">
                <div class="login-input-wrapper">
                    <input type="text" name="username" id="username" class="login-input" placeholder="Enter your email" required autofocus>
                    <i class="fa-regular fa-envelope login-input-icon"></i>
                </div>
            </div>

            <!-- Password Field -->
            <div class="login-form-group">
                <div class="login-input-wrapper">
                    <input type="password" name="password" id="password" class="login-input" placeholder="Enter your password" required>
                    <i class="fa-solid fa-lock login-input-icon"></i>
                    <div class="password-controls">
                        <i class="fa-regular fa-eye toggle-password" id="toggle-password-visibility" title="Toggle Password Visibility"></i>
                    </div>
                </div>
            </div>

            <!-- Control links -->
            <div class="login-controls-row">
                <label class="login-checkbox-label">
                    <input type="checkbox" name="remember" class="login-checkbox">
                    Remember me
                </label>
                <a href="{% url 'forgot_password' %}" class="login-forgot-link">Forgot password?</a>
            </div>

            <!-- Action submit -->
            <button type="submit" class="login-submit-btn" id="loginSubmitBtn">
                Log In
            </button>
        </form>

        <!-- Register call to action -->
        <div class="register-section">
            Don't have an account? <a href="#" class="register-link">Register</a>
        </div>
    </div>

    <!-- Footer Copyright -->
    <div class="login-footer">
        &copy; 2026 Greenbacks Lexverse Pvt. Ltd. All rights reserved.
    </div>

    <!-- Interaction scripting -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Password visibility toggle
            const passwordInput = document.getElementById('password');
            const togglePassword = document.getElementById('toggle-password-visibility');
            
            togglePassword.addEventListener('click', function() {
                const isPassword = passwordInput.getAttribute('type') === 'password';
                passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
                
                // Toggle eye icon class
                this.classList.toggle('fa-eye');
                this.classList.toggle('fa-eye-slash');
            });

            // Prevent double submits
            const form = document.getElementById('loginForm');
            form.addEventListener('submit', function() {
                const btn = document.getElementById('loginSubmitBtn');
                btn.disabled = true;
                btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Logging in...';
            });
        });
    </script>
</body>
</html>
