{% extends 'base_auth.html' %}

{% block title %}Reset Password - GBL Billing{% endblock %}
{% block heading %}New Password{% endblock %}
{% block subheading %}Create a secure password for your account{% endblock %}

{% block content %}
<form method="POST">
    {% csrf_token %}
    <div class="form-group" style="margin-bottom: 1.25rem;">
        <label class="form-label">New Password</label>
        <input type="password" name="new_password" class="form-control" placeholder="••••••••" minlength="8" required autofocus style="width: 100%; box-sizing: border-box; padding: 0.75rem; border-radius: 4px; border: 1px solid var(--border);">
    </div>
    
    <div class="form-group" style="margin-bottom: 1.5rem;">
        <label class="form-label">Confirm New Password</label>
        <input type="password" name="confirm_password" class="form-control" placeholder="••••••••" minlength="8" required style="width: 100%; box-sizing: border-box; padding: 0.75rem; border-radius: 4px; border: 1px solid var(--border);">
    </div>
    
    <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.75rem; font-weight: 600;">
        <i class="fa-solid fa-key" style="margin-right: 6px;"></i> Update Password
    </button>
</form>
{% endblock %}
