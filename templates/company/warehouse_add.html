{% extends 'base_company.html' %}

{% block title %}Add Warehouse{% endblock %}
{% block sub_warehouses %}sub-item-active{% endblock %}

{% block content %}
<div class="page-header">
    <h1 class="page-title">Add Warehouse Location</h1>
    <a href="{% url 'warehouse_list' %}" class="btn btn-secondary">
        <i class="fa-solid fa-arrow-left"></i> Back
    </a>
</div>

<form method="POST" class="card-container" style="max-width: 600px;">
    {% csrf_token %}
    <div class="card-header"><h3 class="card-title">Warehouse Details</h3></div>
    <div class="card-body">
        {{ form.as_p }}
        <div style="display: flex; justify-content: flex-end; gap: 1rem; margin-top: 1.5rem;">
            <a href="{% url 'warehouse_list' %}" class="btn btn-secondary">Cancel</a>
            <button type="submit" class="btn btn-primary">Create Warehouse</button>
        </div>
    </div>
</form>
{% endblock %}
